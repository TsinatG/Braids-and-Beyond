<?xml version="1.0" encoding="UTF-8"?>
<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Define gradients -->
  <defs>
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a2387" />
      <stop offset="50%" stop-color="#e94057" />
      <stop offset="100%" stop-color="#f27121" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <!-- Pattern to represent braided texture -->
    <pattern id="braidPattern" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2"/>
    </pattern>
  </defs>
  
  <!-- Background circle with gradient -->
  <circle cx="50" cy="50" r="48" fill="url(#backgroundGradient)" />
  
  <!-- Braided texture overlay -->
  <circle cx="50" cy="50" r="48" fill="url(#braidPattern)" fill-opacity="0.3" />
  
  <!-- Decorative braid strand elements -->
  <path d="M25,30 Q35,40 25,50 Q15,60 25,70" stroke="#ffffff" stroke-opacity="0.6" stroke-width="3" fill="none" />
  <path d="M75,30 Q65,40 75,50 Q85,60 75,70" stroke="#ffffff" stroke-opacity="0.6" stroke-width="3" fill="none" />
  
  <!-- Text B&B -->
  <text x="50" y="58" font-family="Arial, sans-serif" font-weight="bold" font-size="28" fill="url(#textGradient)" text-anchor="middle">B&amp;B</text>
</svg> 